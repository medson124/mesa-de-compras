<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · Mesa de Compras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#EEF0EC;--panel:#FFFFFF;--ink:#1A1E23;--muted:#5E6670;--line:#D5D9D3;--tape:#F2C230;--tape-ink:#2A2200;--act:#1E5BB8;--act-ink:#FFFFFF;--bad:#B3261E}
@media (prefers-color-scheme: dark){:root{--bg:#14171B;--panel:#1C2026;--ink:#E7EAEE;--muted:#9AA3AD;--line:#2E343C;--tape:#E5B729;--tape-ink:#1E1800;--act:#6FA0EC;--act-ink:#0D1626;--bad:#F08A82;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--panel);border:1px solid var(--line);padding:24px;width:100%;max-width:360px;display:grid;gap:14px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;font-size:30px;margin:0;line-height:1;display:flex;gap:10px;align-items:center}
h1 span{background:var(--tape);color:var(--tape-ink);font-size:13px;padding:2px 8px;letter-spacing:.08em}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:10px}
button{font:inherit;font-weight:600;border:0;background:var(--act);color:var(--act-ink);padding:11px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.err{color:var(--bad);font-size:14px;margin:0}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Mesa de Compras <span>Galpão</span></h1>
  <p class="err" id="err" hidden>Usuário ou senha incorretos.</p>
  <label>Usuário<input name="usuario" id="usuario" autocomplete="username" required></label>
  <label>Senha<input name="senha" id="senha" type="password" autocomplete="current-password" required></label>
  <button type="submit">Entrar</button>
</form>
<script>if(new URLSearchParams(location.search).get("erro"))document.getElementById("err").hidden=false</script>
</body>
</html>
